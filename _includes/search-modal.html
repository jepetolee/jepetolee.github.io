<dialog class="search-dialog" id="search-dialog" aria-labelledby="search-dialog-title">
  <div class="search-dialog__header">
    <h2 class="search-dialog__title" id="search-dialog-title">Search</h2>
    <button type="button" class="search-dialog__close" id="search-close" aria-label="Close search">&times;</button>
  </div>
  <div class="search-dialog__body">
    <input type="search" id="search-input" class="search-dialog__input" placeholder="검색어 입력" autocomplete="off">
    <ul id="results-container"></ul>
  </div>
</dialog>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof SimpleJekyllSearch === 'undefined') return;

    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('results-container'),
      json: '{{ site.baseurl }}/dest/search.json',
      searchResultTemplate: '<li><a href="{url}">{title}<small>{desc}</small></a></li>',
      noResultsText: '<p class="search-no-results">문서가 존재하지 않습니다.</p>',
      limit: 15,
      fuzzy: false,
      exclude: ['Welcome']
    });
  });
</script>
